<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Buffett Investment Check</title>

<!-- PWA / Add to Home Screen -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0e17">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Buffett Check">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<meta name="description" content="เครื่องมือตรวจสอบก่อนเติมเงินเข้าพอร์ตจริง · Mega Trend watchlist, จังหวะสะสม และเช็กลิสต์ก่อนซื้อ">
<style>
  :root{
    --bg:#0a0e17; --bg2:#111726; --card:#151c2c; --line:#222b3f;
    --txt:#e8eef7; --sub:#8a96ab; --mut:#5d6a82;
    --green:#26c281; --teal:#2dd4bf; --yellow:#f0c040; --orange:#f59e42; --red:#ef5365;
    --blue:#4f8cff; --purple:#9b7bff;
    --shadow:0 8px 30px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue","Sukhumvit Set","Noto Sans Thai",sans-serif;
    max-width:560px;margin:0 auto;padding:0 0 40px;line-height:1.5;
  }
  .wrap{padding:0 14px;}

  header{padding:14px 14px 8px;}
  h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.2px;}
  .sub{color:var(--sub);font-size:11.5px;margin-top:2px;}
  .ipsver{
    display:inline-block;font-size:9px;font-weight:800;letter-spacing:.4px;
    color:var(--purple);border:1px solid #3a3060;border-radius:5px;padding:1px 5px;margin-left:5px;
  }

  /* hidden attribute ต้องชนะ display ของ class เสมอ (เช่น nav.tabs ตอนอยู่ตลาดไทย) */
  [hidden]{display:none !important;}
  /* ---- tabs ---- */
  nav.tabs{
    position:sticky;top:0;z-index:25;background:var(--bg);
    display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
    padding:8px 14px 9px;border-bottom:1px solid var(--line);
  }
  nav.tabs button{
    border:1px solid var(--line);background:var(--card);color:var(--sub);
    border-radius:10px;padding:9px 4px;font-size:12.5px;font-weight:700;
    font-family:inherit;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  nav.tabs button[aria-selected="true"]{background:#20264a;color:#fff;border-color:var(--purple);}

  /* ---- status bar ---- */
  .statusbar{
    display:flex;align-items:center;gap:7px;flex-wrap:wrap;
    background:var(--bg2);border:1px solid var(--line);border-radius:10px;
    padding:7px 10px;margin:12px 0 10px;font-size:10.5px;color:var(--sub);
  }
  .statusbar .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .statusbar .sep{color:var(--mut);}
  .statusbar.off{background:rgba(245,158,66,.13);border-color:rgba(245,158,66,.4);color:#f5b969;}

  /* ---- panels ---- */
  .panel{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:13px 14px;margin:0 0 10px;
  }
  .panel h2{font-size:13.5px;margin:0 0 3px;font-weight:800;display:flex;align-items:center;gap:6px;}
  .panel .lead{font-size:11px;color:var(--sub);line-height:1.55;}
  .note{font-size:10px;color:var(--mut);line-height:1.6;margin-top:8px;}
  .sec-title{font-size:12.5px;font-weight:800;margin:18px 4px 8px;display:flex;align-items:center;gap:7px;}
  .sec-title .hint{font-size:10px;color:var(--mut);font-weight:400;margin-left:auto;}

  .info-box{background:rgba(79,140,255,.10);border:1px solid rgba(79,140,255,.30);border-radius:9px;
    padding:8px 10px;font-size:11px;color:#a9c6ff;line-height:1.55;margin-top:8px;}
  .warn-box{background:rgba(245,158,66,.11);border:1px solid rgba(245,158,66,.35);border-radius:9px;
    padding:8px 10px;font-size:11px;color:#f5b969;line-height:1.55;margin-top:8px;}
  .risk-box{background:rgba(239,83,101,.10);border:1px solid rgba(239,83,101,.32);border-radius:9px;
    padding:8px 10px;font-size:11px;color:#ff9aa8;line-height:1.55;margin-top:8px;}
  .miss-box{background:rgba(93,106,130,.13);border:1px solid #2d374b;border-radius:9px;
    padding:8px 10px;font-size:11px;color:var(--sub);line-height:1.55;margin-top:8px;}
  ul.tight{margin:5px 0 0;padding-left:17px;font-size:11px;color:var(--sub);line-height:1.7;}
  ul.tight li::marker{color:var(--mut);}

  /* ---- Kirin ---- */
  .kirin{
    background:linear-gradient(180deg,#16203a 0%,#121a2b 100%);
    border:1px solid #2b3a5c;border-radius:14px;padding:13px 14px;margin:0 0 10px;
    position:relative;overflow:hidden;
  }
  .kirin::before{content:"";position:absolute;top:-40px;right:-30px;width:120px;height:120px;
    background:radial-gradient(circle,rgba(155,123,255,.22),transparent 70%);pointer-events:none;}
  .kirin-head{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .kirin-title{font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px;}
  .kirin-btn{
    border:none;border-radius:18px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;
    background:var(--purple);color:#0a0e17;font-family:inherit;flex-shrink:0;
  }
  .kirin-btn:disabled{opacity:.5;}
  .kirin-text{font-size:12.3px;line-height:1.65;margin-top:10px;white-space:pre-wrap;color:#dfe6f2;}
  .kirin-text b{color:#fff;}
  .kirin-meta{font-size:9.5px;color:var(--mut);margin-top:8px;}
  .kirin-quota{display:flex;align-items:center;gap:7px;margin-top:9px;font-size:10.5px;color:var(--sub);flex-wrap:wrap;}
  .kirin-quota .meter{display:flex;gap:4px;}
  .kirin-quota .d{width:8px;height:8px;border-radius:50%;background:#2b3a5c;}
  .kirin-quota .d.used{background:var(--purple);}
  .kirin-quota .rem{font-weight:700;color:var(--txt);}
  .kirin-quota .rem.empty{color:var(--orange);}
  .kirin .dots::after{content:"…";animation:dots 1.3s steps(4,end) infinite;}
  @keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

  /* ---- cards ---- */
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:11px 12px;margin-bottom:8px;position:relative;overflow:hidden;cursor:pointer;
  }
  .card:active{transform:scale(.995);}
  .card.core{border-color:#2c5c46;background:linear-gradient(180deg,#16261f 0%,#151c2c 65%);padding:13px 14px;}
  .card .accent{position:absolute;left:0;top:0;bottom:0;width:3px;}
  .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .tk{font-size:15px;font-weight:800;letter-spacing:.3px;}
  .card.core .tk{font-size:18px;}
  .nm{font-size:10.5px;color:var(--sub);margin-top:1px;}
  .theme-tag{font-size:9px;color:var(--mut);margin-top:2px;}
  .price{font-size:15px;font-weight:700;text-align:right;white-space:nowrap;}
  .chg{font-size:11px;font-weight:600;text-align:right;margin-top:1px;}
  .badge{display:inline-block;font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px;letter-spacing:.2px;}
  .pill{font-size:9px;font-weight:700;padding:2px 6px;border-radius:5px;background:var(--bg2);color:var(--sub);border:1px solid var(--line);}
  .pills{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px;align-items:center;}
  .reason{font-size:10.5px;color:var(--sub);margin-top:7px;line-height:1.5;}
  .datestamp{font-size:9px;color:var(--mut);margin-top:7px;}
  .cta{
    margin-top:8px;border:1px solid var(--line);background:var(--bg2);color:var(--blue);
    border-radius:8px;padding:6px 10px;font-size:10.5px;font-weight:700;font-family:inherit;cursor:pointer;width:100%;
  }
  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:5px;margin-top:9px;}
  .met{background:var(--bg2);border-radius:8px;padding:6px 7px;text-align:center;}
  .met .k{font-size:8.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;}
  .met .v{font-size:12.5px;font-weight:700;margin-top:2px;}
  .met .d{font-size:7.5px;color:var(--mut);margin-top:1px;}
  .rank{
    position:absolute;right:10px;bottom:9px;font-size:9px;font-weight:800;color:var(--mut);
  }

  /* ---- filter rows ---- */
  .filters{display:flex;gap:5px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .filters::-webkit-scrollbar{display:none;}
  .filters button{
    flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--sub);
    border-radius:18px;padding:6px 11px;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap;
  }
  .filters button[aria-pressed="true"]{background:#20264a;color:#fff;border-color:var(--purple);}
  .filters.themes button[aria-pressed="true"]{border-color:var(--blue);}

  /* ---- gauge (compact) ---- */
  .gauge{display:flex;align-items:center;gap:11px;}
  .gauge .val{font-size:24px;font-weight:800;line-height:1;}
  .bar{height:7px;border-radius:5px;background:linear-gradient(90deg,#ef5365,#f59e42,#f0c040,#2dd4bf,#26c281);position:relative;flex:1;}
  .bar .pin{position:absolute;top:-3px;width:3px;height:13px;border-radius:2px;background:#fff;box-shadow:0 0 6px rgba(255,255,255,.8);transform:translateX(-50%);transition:left .8s cubic-bezier(.2,.8,.2,1);}

  /* ---- strategic guide ---- */
  details.guide{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;}
  details.guide>summary{list-style:none;cursor:pointer;}
  details.guide>summary::-webkit-details-marker{display:none;}
  .guide-h{display:flex;align-items:center;gap:7px;}
  .guide-h .t{font-size:13.5px;font-weight:800;}
  .guide-h .caret{margin-left:auto;color:var(--mut);font-size:11px;}
  details.guide[open] .caret::after{content:"ย่อ ▾";}
  details.guide:not([open]) .caret::after{content:"ขยาย ▸";}
  .guide-sub{font-size:10.5px;color:var(--sub);margin-top:2px;}
  .stack{display:flex;height:22px;border-radius:7px;overflow:hidden;margin-top:11px;}
  .stack .seg{display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:800;color:#0a0e17;}
  .legend{display:flex;flex-wrap:wrap;gap:5px 12px;margin-top:9px;}
  .legend .li{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--sub);}
  .legend .sw{width:9px;height:9px;border-radius:3px;flex-shrink:0;}
  .legend .li b{color:var(--txt);}
  .themebars{margin-top:12px;}
  .tb{display:flex;align-items:center;gap:8px;margin-top:6px;}
  .tb .l{font-size:10.5px;flex:0 0 40%;color:var(--txt);}
  .tb .track{flex:1;height:6px;border-radius:4px;background:var(--bg2);overflow:hidden;}
  .tb .f{height:100%;border-radius:4px;}
  .tb .p{font-size:10.5px;font-weight:800;flex:0 0 34px;text-align:right;}

  /* ---- checklist ---- */
  .chk{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);}
  .chk:last-of-type{border-bottom:none;}
  .chk input{width:17px;height:17px;flex-shrink:0;margin:1px 0 0;accent-color:var(--purple);}
  .chk label{font-size:11.5px;line-height:1.5;color:var(--txt);cursor:pointer;}
  .chk input:checked + label{color:var(--sub);}

  /* ---- quick check form ---- */
  .qc-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px;}
  .qc-f{display:flex;flex-direction:column;gap:3px;}
  .qc-f label{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;}
  .qc-f input{
    background:var(--bg2);border:1px solid var(--line);border-radius:7px;color:var(--txt);
    font-family:inherit;font-size:12px;padding:6px 8px;width:100%;
  }
  .qc-f input:focus{outline:none;border-color:var(--blue);}
  .qc-save{display:flex;align-items:center;gap:7px;margin-top:9px;font-size:10.5px;color:var(--sub);}
  .qc-save input{width:15px;height:15px;accent-color:var(--purple);}
  .qc-out{margin-top:9px;}
  .qc-row{display:flex;justify-content:space-between;font-size:11.5px;padding:4px 0;border-bottom:1px solid var(--line);}
  .qc-row b{font-weight:800;}

  /* ---- detail drawer ---- */
  #sheet,#thaiSheet{display:none;position:fixed;inset:0;z-index:100;background:rgba(5,8,14,.8);}
  .sh{max-width:560px;margin:0 auto;height:100%;overflow-y:auto;background:var(--bg);
      border-left:1px solid var(--line);border-right:1px solid var(--line);}
  .sh-head{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;
    align-items:flex-start;padding:16px 14px 11px;border-bottom:1px solid var(--line);z-index:2;}
  .sh-name{font-size:18px;font-weight:800;}
  .sh-tick{font-size:11px;color:var(--sub);margin-top:2px;}
  .sh-x{width:34px;height:34px;border-radius:50%;border:none;background:var(--card);color:var(--txt);
    font-size:15px;font-weight:700;cursor:pointer;flex-shrink:0;}
  .sh-body{padding:0 14px 40px;}
  .sh-price{padding:13px 0 4px;}
  .sh-price .p{font-size:28px;font-weight:800;}
  .sh-price .c{font-size:13px;font-weight:700;margin-left:9px;}
  .sh-sec{margin-top:16px;}
  .sh-sec h3{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin:0 0 6px;font-weight:800;}
  .sh-sec p{font-size:12px;line-height:1.65;color:var(--txt);margin:0;}
  .cm-ranges{display:flex;gap:6px;padding:10px 0;flex-wrap:wrap;}
  .cm-ranges button{border:none;border-radius:18px;padding:6px 12px;font-size:11.5px;font-weight:700;
    background:var(--card);color:var(--sub);cursor:pointer;font-family:inherit;}
  .cm-ranges button.on{background:var(--green);color:#04170e;}
  .cm-chart{min-height:180px;}
  .cm-chart svg{width:100%;height:auto;display:block;}
  .cm-axis{display:flex;justify-content:space-between;font-size:10px;color:var(--mut);padding:2px 0 6px;}

  .loading{color:var(--sub);font-size:11.5px;}
  .skel{animation:pulse 1.3s infinite;background:var(--bg2);border-radius:6px;height:13px;width:56px;display:inline-block;}
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:.9}}
  .err{color:var(--red);font-size:11px;}
  footer{color:var(--mut);font-size:10px;line-height:1.7;padding:0 4px;}
  .refresh{
    position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
    background:var(--blue);color:#fff;border:none;border-radius:30px;
    padding:10px 20px;font-size:12.5px;font-weight:700;box-shadow:0 6px 20px rgba(79,140,255,.45);
    z-index:30;display:flex;align-items:center;gap:7px;cursor:pointer;
  }
  .refresh:active{transform:translateX(-50%) scale(.95);}
  .spin{animation:rot 1s linear infinite;}
  @keyframes rot{to{transform:rotate(360deg)}}
  .market-switch{display:flex;gap:7px;padding:0 14px 10px;border-bottom:1px solid var(--line);}
  .market-switch button{display:flex;align-items:center;justify-content:center;gap:7px;flex:1;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--sub);padding:8px 6px;font:700 11px inherit;cursor:pointer;}
  .market-switch button[aria-pressed="true"]{background:#20264a;border-color:var(--purple);color:#fff;}
  .flag-svg{width:22px;height:15px;border-radius:2px;box-shadow:0 1px 4px rgba(0,0,0,.35);flex:none;}
  .thai-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;margin:17px 4px 9px;}
  .thai-title .hint{font-size:10px;color:var(--mut);font-weight:400;margin-left:auto;}
  .thai-card{cursor:pointer;}
  .thai-card .thai-reason{font-size:10.5px;color:var(--sub);margin-top:8px;line-height:1.5;}
  .thai-sheet-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:10px;}
  .thai-sheet-metrics .met{min-height:54px;}
  .thai-analysis{margin-top:11px;background:rgba(79,140,255,.10);border:1px solid rgba(79,140,255,.30);border-radius:9px;padding:8px 10px;font-size:11px;color:#a9c6ff;line-height:1.55;}
  .tf-block{margin-top:12px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);}
  .tf-title{font-size:12px;font-weight:800;margin-bottom:4px;} .tf-unit{color:var(--mut);font-weight:600;font-size:10.5px;}
  .tf-sub{font-size:10px;color:var(--sub);font-weight:700;margin-bottom:2px;}
  .tf-svg{width:100%;height:auto;display:block;}
  .tf-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .tf-table-wrap{overflow-x:auto;margin-top:6px;-webkit-overflow-scrolling:touch;}
  .tf-table{border-collapse:collapse;width:100%;min-width:300px;font-size:10.5px;}
  .tf-table th,.tf-table td{padding:4px 5px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;vertical-align:top;}
  .tf-table thead th{color:var(--mut);font-weight:700;} .tf-table tbody th{text-align:left;color:var(--sub);font-weight:600;}
  .tf-na{color:var(--mut);} .tf-calc{font-size:8.5px;color:var(--yellow);border:1px solid rgba(240,192,64,.4);border-radius:4px;padding:0 3px;margin-left:2px;}
  .tf-over{font-size:8.5px;color:var(--orange);white-space:normal;}
  .tf-legend{display:flex;flex-wrap:wrap;gap:10px;font-size:9.5px;color:var(--mut);margin-top:3px;} .tf-legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;}
  .tf-check{margin-top:8px;font-size:11px;line-height:1.55;color:var(--txt);background:rgba(240,192,64,.08);border:1px solid rgba(240,192,64,.28);border-radius:8px;padding:7px 9px;}
  .tf-src{font-size:9.5px;color:var(--mut);margin-top:6px;line-height:1.6;} .tf-src a,.tf-bank-met a{color:#9ebdff;}
  .tf-bank{display:grid;grid-template-columns:repeat(auto-fit,minmax(98px,1fr));gap:5px;} .tf-bank-met{text-align:left;}
  .thai-analysis ul{margin:0;padding-left:16px;}.thai-analysis li+li{margin-top:3px;}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>

<header>
  <h1>🧭 Buffett Investment Check</h1>
  <div class="sub" id="appSub">เครื่องมือตรวจสอบก่อนเติมเงินเข้าพอร์ตจริง<span class="ipsver" id="ipsVer">IPS v2.1</span></div>
</header>

<div class="market-switch" id="marketSwitch" role="group" aria-label="เลือกตลาดลงทุน"></div>

<nav class="tabs" id="tabs" role="tablist"></nav>

<div class="wrap">
  <div class="statusbar" id="statusBar" role="status"><span class="loading">กำลังโหลดข้อมูลตลาด…</span></div>

  <section id="tabToday"  role="tabpanel"></section>
  <section id="tabMega"   role="tabpanel" hidden></section>
  <section id="tabIncome" role="tabpanel" hidden></section>
  <section id="tabThai" role="tabpanel" hidden></section>
</div>

<button class="refresh" id="refreshBtn" onclick="refreshActiveMarket()" aria-label="รีเฟรชราคา">
  <span id="refIcon">↻</span> รีเฟรช
</button>

<!-- Detail drawer: กดการ์ด/ปุ่ม "ดูรายละเอียด" -->
<div id="sheet" role="dialog" aria-modal="true" aria-label="รายละเอียดหลักทรัพย์">
  <div class="sh">
    <div class="sh-head">
      <div><div class="sh-name" id="shName">–</div><div class="sh-tick" id="shTick">–</div></div>
      <button class="sh-x" onclick="closeSheet()" aria-label="ปิด">✕</button>
    </div>
    <div class="sh-body" id="shBody"></div>
  </div>
</div>

<!-- Thai-stock detail drawer -->
<div id="thaiSheet" role="dialog" aria-modal="true" aria-label="รายละเอียดหุ้นไทย" style="display:none">
  <div class="sh">
    <div class="sh-head">
      <div><div class="sh-name" id="thaiSheetName">–</div><div class="sh-tick" id="thaiSheetTick">–</div></div>

const yUrl = (t,rg,iv,ev) => `https://query1.finance.yahoo.com/v8/finance/chart/${t}?range=${rg}&interval=${iv}` + (ev?`&events=${ev}`:"");
const SOURCES = [
  (t,rg,iv,ev) => `./api/chart?symbol=${t}&range=${rg}&interval=${iv}` + (ev?`&events=${ev}`:""),
  (t,rg,iv,ev) => "https://api.allorigins.win/raw?url=" + encodeURIComponent(yUrl(t,rg,iv,ev)),

  (t,rg,iv,ev) => "https://api.codetabs.com/v1/proxy/?quest=" + encodeURIComponent(yUrl(t,rg,iv,ev)),
];
async function fetchWithTimeout(url, ms){
  const ctrl = new AbortController();
  const id = setTimeout(() => ctrl.abort(), ms);
  try { return await fetch(url, {cache:"no-store", signal:ctrl.signal}); }
  finally { clearTimeout(id); }
}
async function fetchYahoo(ticker, range="1y", interval="1d", events=""){
  for(let i=0; i<SOURCES.length; i++){
    const ms = i === 0 ? 9000 : 6000;
    try{
      const r = await fetchWithTimeout(SOURCES[i](ticker, range, interval, events), ms);
      if(!r.ok) continue;
      const j = await r.json();
      if(j && j.chart && j.chart.result && j.chart.result[0]){
        if(r.headers.get("x-from-cache")) window.__fromCache = true;   // served by SW offline
        return j.chart.result[0];
      }
    }catch(e){ /* timed out or failed — try next source */ }
  }
  throw new Error("no data");
}

function thaiMetricData(daily,monthly,fund){

  const high=meta.fiftyTwoWeekHigh??(day.length?Math.max(...day.map(p=>p.c)):null);

  const annualEps=thaiRows(fund,"annualDilutedEPS"), ttmRow=thaiLast(thaiRows(fund,"trailingEps")), fyRow=thaiLast(annualEps);
  const eps=ttmRow?.v??fyRow?.v??null;

  const peRow=thaiLast(thaiRows(fund,"trailingPeRatio")), directPe=peRow?.v??null;
  const pe=directPe??(eps>0&&price?price/eps:null);
  const peSource=directPe!=null?"yahoo":pe!=null?"calc":null;
  // ตรวจ P/E ของ provider เทียบ ราคา ÷ EPS ที่มี — บอกด้วยว่าฐานงวดตรงกันหรือไม่ (ไม่เขียนทับค่า provider)
  const peChk=eps!=null?{...TF.peCheck({price, eps, providerPe:directPe}), sameBasis:!!ttmRow}:null;
  const pes=mon.map(p=>{ let e=null; annualEps.forEach(row=>{if(new Date(row.d).getTime()+45*86400000<=p.t*1000)e=row.v;});return e>0?p.c/e:null; }).filter(v=>v>0&&v<200);
  const divs=Object.values((daily&&daily.events&&daily.events.dividends)||{}).filter(x=>thaiNum(x&&x.amount)!=null&&x.date>=Date.now()/1000-370*86400).reduce((s,x)=>s+x.amount,0);
  const qOp=thaiRows(fund,"quarterlyOperatingIncome").slice(-4), operating=qOp.length===4?qOp.reduce((s,x)=>s+x.v,0):thaiLast(thaiRows(fund,"annualOperatingIncome"))?.v??null;
  const latest=type=>thaiLast(thaiRows(fund,"quarterly"+type))?.v??thaiLast(thaiRows(fund,"annual"+type))?.v??null;
  const assets=latest("TotalAssets"), debt=latest("TotalDebt"), equity=latest("StockholdersEquity"), marketCap=thaiLast(thaiRows(fund,"trailingMarketCap"))?.v??null;
  // คะแนนจังหวะ: ตรรกะเดียวกับหุ้นสหรัฐ (มูลค่าเทียบอดีต 50 / ส่วนลดจาก High 30 / RSI 20)
  const val=EN.valuationFromHistory({annual:annualEps.map(r=>({d:r.d,eps:r.v})), monthly:mon, price});
  const sc=EN.scoreStock({price, hi52:high, rsiv:EN.rsi(day.map(p=>p.c)), val});
  return {val:EN.okVal(val)?{curPE:val.curPE,medPE:val.medPE,ratio:val.ratio,asOfMs:Date.now()}:{reason:val.reason}, mode:sc.mode, modeWhy:sc.modeWhy, score:sc.score, drawdown:EN.drawdownPct(price,high),
    epsBasis, peSource, peAsOf:peRow?.d||null, peChk,
    price, high, chgPct:price&&prevClose?(price-prevClose)/prevClose*100:null, dd:price&&high?(price/high-1)*100:null, pe, peMedian:thaiMedian(pes), eps, yieldPct:price&&divs>0?divs/price*100:null, operating, pbv:marketCap&&equity>0?marketCap/equity:null, debtAssets:debt!=null&&assets>0?debt/assets*100:null, marketTime:meta.regularMarketTime||thaiLast(day)?.t||null};
}

/* ---------- Valuation: trailing P/E เทียบมัธยฐาน P/E ในอดีตของตัวเอง ---------- */
async function fetchEps(t){
  try{
    const r = await fetchWithTimeout(`./api/eps?symbol=${t}`, 9000);
    if(!r.ok) return null;
    const j = await r.json();
    const out = {q:[], a:[]};
    for(const res of (j && j.timeseries && j.timeseries.result) || []){
      const type = res && res.meta && res.meta.type && res.meta.type[0];
      const rows = (res[type]||[]).filter(x=>x && x.reportedValue && x.reportedValue.raw!=null);
      // เรียงตามวันที่เอง — อย่าเชื่อลำดับที่ Yahoo ส่งมา
      const arr = rows.map(x=>({d:x.asOfDate, eps:x.reportedValue.raw})).sort((a,b)=>new Date(a.d)-new Date(b.d));
      if(type==="quarterlyDilutedEPS") out.q = arr;
      if(type==="annualDilutedEPS")   out.a = arr;
    }
    return out;
  }catch(e){ return null; }
}

/* P/E ปัจจุบันและแบนด์ P/E ในอดีต ต้องคิดจากฐาน EPS เดียวกัน
   ไม่งั้นหุ้นที่กำไรกำลังโตเร็วจะดู "ถูก" เกินจริงอย่างเป็นระบบ */
const G = CFG.VALUATION_GUARDS;
async function getValuation(t, price){
  const KEY = "val2:"+t;
  try{
    let c = null;
    try{ c = JSON.parse(localStorage.getItem(KEY)||"null"); }catch(_){}
    if(!c || Date.now()-c.ts > 24*3600*1000){
      c = {ts:Date.now(), eps:null, medPE:null, reason:"ไม่มีข้อมูลงบกำไร"};
      const raw = await fetchEps(t);
      const annual = (raw&&raw.a)||[];
      // ดึงราคา 5 ปีเฉพาะเมื่องบผ่านด่านแรก (ประหยัด request) — ตรรกะทั้งหมดอยู่ใน EN.valuationFromHistory
      const pre = EN.valuationFromHistory({annual, monthly:[], price});
      if(pre.needsHistory){
        const hist = await fetchYahoo(t, "5y", "1mo");
        const ts = hist.timestamp||[], cl = (hist.indicators&&hist.indicators.quote&&hist.indicators.quote[0].close)||[];
        const v = EN.valuationFromHistory({annual, monthly: ts.map((x,i)=>({t:x, c:cl[i]})), price});
        c.medPE = v.medPE ?? null; c.eps = v.eps ?? null; c.reason = v.medPE ? null : v.reason;
      }else{
        c.reason = pre.reason;
      }
      try{ localStorage.setItem(KEY, JSON.stringify(c)); }catch(_){}
    }
    if(c.eps>0 && c.medPE>0){
      const curPE = price/c.eps;
      return {curPE, medPE:c.medPE, ratio:curPE/c.medPE, asOfMs:c.ts};
    }
    return {reason:c.reason || "ข้อมูลมูลค่าไม่พอ"};
  }catch(e){ return {reason:"ดึงข้อมูลงบไม่สำเร็จ"}; }
}

/* ---------- Distribution data (SCHD / JEPQ) ---------- */
async function getDistributionData(t){
  const KEY = "dist2:"+t;
  let c = null;
  try{ c = JSON.parse(localStorage.getItem(KEY)||"null"); }catch(_){}
  if(c && Date.now()-c.ts <= 24*3600*1000) return c;
  try{
    const hist = await fetchYahoo(t, "5y", "1mo", "div");
    const divs = (hist.events && hist.events.dividends)
      ? Object.values(hist.events.dividends).filter(d=>d&&d.amount>0).map(d=>({date:d.date, amount:d.amount})).sort((a,b)=>a.date-b.date)
      : [];
    const ts = hist.timestamp||[];
    const q  = (hist.indicators&&hist.indicators.quote&&hist.indicators.quote[0])||{};
    const adj= (hist.indicators&&hist.indicators.adjclose&&hist.indicators.adjclose[0]&&hist.indicators.adjclose[0].adjclose)||null;
    c = {ts:Date.now(), divs, series:{ts, close:(q.close||[])}, adjClose:adj};
    try{ localStorage.setItem(KEY, JSON.stringify(c)); }catch(_){}
    return c;
  }catch(e){
    return c || {ts:Date.now(), divs:[], series:{ts:[],close:[]}, adjClose:null, error:true};
  }
}

/* ---------- Load one security ---------- */
async function loadOne(sec){
  try{
    const res = await fetchYahoo(sec.t);
    const meta = res.meta||{};
    const rawTs = res.timestamp || [];
    const rawCl = (res.indicators && res.indicators.quote && res.indicators.quote[0].close) || [];
    const ts=[], closes=[];
    for(let i=0;i<rawTs.length;i++){ if(rawTs[i]!=null && rawCl[i]!=null){ ts.push(rawTs[i]); closes.push(rawCl[i]); } }
    const price = meta.regularMarketPrice ?? closes[closes.length-1];
    if(!EN.isNum(price)) return {error:true, t:sec.t};

    // % รายวันจริง เทียบราคาปิดวันทำการก่อนหน้าในซีรีส์
    // (ห้ามใช้ meta.chartPreviousClose — สำหรับ range=1y มันคือราคาปิดเมื่อ 1 ปีก่อน)
    let prevClose = null;
    if(closes.length >= 2){
      const lastBarTs = ts[ts.length-1] || 0;
      const mktTs = meta.regularMarketTime || lastBarTs;
      prevClose = (mktTs - lastBarTs) < 24*3600 ? closes[closes.length-2] : closes[closes.length-1];
    }
    const hi52 = meta.fiftyTwoWeekHigh ?? (closes.length ? Math.max(...closes) : null);
    const rsiv = EN.rsi(closes);
    const dd = EN.drawdownPct(price, hi52);

    const d = {
      t: sec.t, sleeve: sec.sleeve, price, hi52, rsi: rsiv, dd, error:false,
      chgPct: prevClose ? (price-prevClose)/prevClose*100 : null,
      marketTime: meta.regularMarketTime || null,
      histStart: ts[0] || null, bars: closes.length, source: SRC_YAHOO,
    };

    // valuation เฉพาะหุ้นรายตัวที่ไม่ใช่ moonshot (moonshot ขาดทุนอยู่แล้ว ข้ามไป)
    if(sec.sleeve === "mega" && !CFG.isMoonshot(sec)) d.val = await getValuation(sec.t, price);
    const mode = EN.cardMode(sec, d.val);
    d.mode = mode.m; d.modeWhy = mode.why;

    if(d.mode === "timing") d.score = EN.buffettScore({price, hi52, rsiv, val:d.val});
    if(d.mode === "core_market") d.core = EN.coreDcaLevel(dd);

    if(d.mode === "dividend_growth" || d.mode === "current_income_option"){
      const raw = await getDistributionData(sec.t);
      const nowSec = Date.now()/1000;
      const stats = EN.distributionStats(raw.divs, raw.series, nowSec);
      d.stats = stats; d.distAsOfMs = raw.ts;
      d.curYield = EN.isNum(stats.ttmDiv) ? stats.ttmDiv/price*100 : null;
      d.totalReturn = EN.totalReturnPct(raw.adjClose);
      d.trYears = (raw.series && raw.series.ts && raw.series.ts.length)
        ? Math.round((nowSec - raw.series.ts[0])/YEAR_SEC) : null;
      if(d.mode === "dividend_growth"){
        d.divGrowth = EN.dividendGrowthScore({curYieldPct:d.curYield, stats, ddPct:dd});
      }else{
        let pricePrev = null;
        const S = raw.series||{ts:[],close:[]};
        for(let i=0;i<S.ts.length;i++){ if(S.ts[i] <= nowSec-YEAR_SEC && EN.isNum(S.close[i])) pricePrev = S.close[i]; }
        d.driver = EN.yieldDriver({
          ttmDiv: stats.ttmDiv, ttmDivPrev: EN.ttmSum(raw.divs, nowSec-YEAR_SEC), price, pricePrev,
        });
        d.income = EN.incomeSustainabilityView({
          curYieldPct:d.curYield, stats, ddPct:dd, rsiv, driver:d.driver, totalReturn:d.totalReturn,
        });
      }
    }
    return d;
  }catch(e){ return {error:true, t:sec.t}; }
}

/* ---------- Formatting ---------- */
function fmt(n,d=2){ return (n==null||isNaN(n)) ? "–" : Number(n).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d}); }
const fmtDT = t => t ? new Date(t*1000).toLocaleString("th-TH",{day:"numeric",month:"short",year:"2-digit",hour:"2-digit",minute:"2-digit"}) : "–";
const fmtD  = t => t ? new Date(t*1000).toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"2-digit"}) : "–";
const fmtDMs= ms => ms ? new Date(ms).toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"2-digit"}) : "–";
const pctTxt = v => EN.isNum(v) ? EN.round(v,1).toFixed(1)+"%" : "—";
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const themeOf = t => CFG.MEGA_THEMES.find(x=>x.key===t) || null;

/* ---------- Market status ---------- */
function isMarketOpen(d=new Date()){
  try{
    const p=new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",weekday:"short",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(d);
    const g=t=>{const x=p.find(y=>y.type===t); return x?x.value:null;};
    const wd=g("weekday");
    if(wd==="Sat"||wd==="Sun") return false;
    const mins=((+g("hour"))%24)*60 + (+g("minute"));
    return mins>=570 && mins<960; // 9:30–16:00 ET
  }catch(e){ return true; }
}

function renderStatusBar(info){
  const el = document.getElementById("statusBar");
  const offline = !navigator.onLine || window.__fromCache;
  el.className = "statusbar" + (offline ? " off" : "");
  const mk = isMarketOpen();
  const parts = [];
  if(offline){
    parts.push(`<b>ออฟไลน์ — แสดงข้อมูลล่าสุดที่บันทึกไว้</b>`);
  }else{
    parts.push(`<span class="dot" style="background:${mk?"var(--green)":"var(--mut)"}"></span>ตลาดสหรัฐ${mk?"เปิดอยู่":"ปิด"}`);
  }
  if(info && info.marketTime) parts.push(`<span class="sep">·</span>ข้อมูล ณ ${fmtDT(info.marketTime)}`);
  if(info && info.savedAt)    parts.push(`<span class="sep">·</span>บันทึกไว้ ${new Date(info.savedAt).toLocaleString("th-TH")}`);
  if(info && info.stale)      parts.push(`<span class="sep">·</span><b>ข้อมูลเก่ากว่าปกติ</b>`);

  el.innerHTML = parts.join(" ");

    <div class="sh-sec"><h3>คุณภาพข้อมูล</h3><ul class="tight"><li>ราคา ณ ${d.marketTime?fmtDT(d.marketTime):"ยังไม่มีวันที่"} · ${SRC_YAHOO}</li><li>P/E, EPS, P/BV และปันผล 12M ด้านบนมาจาก Yahoo (ข้อมูลตลาด) · ส่วน "กำไร ปันผล และการใช้ทุน" มาจาก IR / SET</li><li>งบการเงินอาจรายงานคนละวันกับราคา</li><li>ค่าที่ไม่มีข้อมูลจะแสดง “—” ไม่ใช่ศูนย์</li><li>คะแนน: มูลค่าเทียบอดีต ${CFG.BUFFETT_WEIGHTS.valuation}% · ส่วนลดจาก High ${CFG.BUFFETT_WEIGHTS.drawdown}% · RSI ${CFG.BUFFETT_WEIGHTS.rsi}% (เหมือนหุ้นสหรัฐ)</li>${CFG.SCORE_DISCLAIMER_TH.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><a class="cta" href="https://finance.yahoo.com/quote/${sec.t}.BK" target="_blank" rel="noopener">เปิด ${sec.t}.BK ใน Yahoo Finance ↗</a></div>`;
  renderCmRanges(); loadChart();
  if(!thaiFund && !thaiFundErr){

/* ---------- กำไร ปันผล และการใช้ทุน (หุ้นไทย) — ข้อมูลจาก src/data/thai-fundamentals.json ---------- */
const TF = window.THAI_FUNDAMENTALS;
let thaiFund = null, thaiFundErr = null;
async function loadThaiFund(){
  if(thaiFund) return thaiFund;
  try{
    const r = await fetchWithTimeout("./data/thai-fundamentals.json", 8000);
    if(!r.ok) throw new Error("HTTP "+r.status);
    const j = await r.json();
    const errs = TF.validateData(j);
    if(errs.length) throw new Error("ไฟล์ข้อมูลไม่ผ่านการตรวจ: "+errs[0]);
    thaiFund = j; thaiFundErr = null;
  }catch(e){ thaiFundErr = e.message || String(e); }
  return thaiFund;
}
const escAttr = s => esc(s).replace(/"/g,"&quot;");
const tfNum = (v,d=2) => v==null ? "—" : Number(v).toLocaleString("th-TH",{minimumFractionDigits:d,maximumFractionDigits:d});
const tfBasisTh = b => b==="consolidated" ? "งบการเงินรวม" : b==="separate" ? "งบเฉพาะกิจการ" : (b||"ไม่ระบุฐานงบ");

/* กราฟเล็ก 5 ปี: null = ช่องว่าง (เส้นขาด / แท่งเป็นกรอบประ "N/A") ไม่ลากเหมือนมีค่าจริง */
function tfLineSvg(labels, vals, unit, color){
  const W=320,H=120,P=22, xs=i=>P+(W-2*P)*i/(labels.length-1);
  const nums=vals.filter(v=>v!=null); if(!nums.length) return "";
  let lo=Math.min(0,...nums), hi=Math.max(...nums); if(hi===lo) hi=lo+1;
  const ys=v=>14+(H-36)*(1-(v-lo)/(hi-lo));
  let d="", pen=false;
  vals.forEach((v,i)=>{ if(v==null){pen=false;return;} d+=(pen?"L":"M")+xs(i).toFixed(1)+" "+ys(v).toFixed(1); pen=true; });
  return `<svg viewBox="0 0 ${W} ${H}" class="tf-svg" role="img" aria-label="กราฟ ${unit}">
    <line x1="${P}" x2="${W-P}" y1="${ys(Math.max(lo,0)).toFixed(1)}" y2="${ys(Math.max(lo,0)).toFixed(1)}" stroke="#2a3346"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round"/>
    ${vals.map((v,i)=>v==null
      ? `<text x="${xs(i)}" y="${H-28}" text-anchor="middle" font-size="9" fill="#5d6a82">N/A</text>`
      : `<circle cx="${xs(i)}" cy="${ys(v)}" r="3.2" fill="${color}"/><text x="${xs(i)}" y="${ys(v)-6}" text-anchor="middle" font-size="9" fill="#c9d3e6">${tfNum(v,1)}</text>`).join("")}
    ${labels.map((l,i)=>`<text x="${xs(i)}" y="${H-6}" text-anchor="middle" font-size="9" fill="#7b879c">${l}</text>`).join("")}
  </svg>`;
}
function tfBarSvg(labels, series, unit){
  // series: [{vals:[...], color}] วางซ้อน (stack) ; null ในชุดแรก = ปีที่ไม่มีข้อมูล
  const W=320,H=120,P=22, n=labels.length, bw=(W-2*P)/n*0.55, xc=i=>P+(W-2*P)*(i+.5)/n;
  const tot=labels.map((_,i)=>series[0].vals[i]==null?null:series.reduce((s,x)=>s+(x.vals[i]||0),0));
  const nums=tot.filter(v=>v!=null); if(!nums.length) return "";
  const lo=Math.min(0,...nums), hi=Math.max(0,...nums), span=(hi-lo)||1, ys=v=>14+(H-36)*(1-(v-lo)/span);
  let bars="";
  labels.forEach((_,i)=>{
    if(tot[i]==null){ bars+=`<rect x="${xc(i)-bw/2}" y="${ys(hi)}" width="${bw}" height="${Math.max(8,ys(lo)-ys(hi))}" fill="none" stroke="#2f3a50" stroke-dasharray="3 3"/><text x="${xc(i)}" y="${(ys(hi)+ys(lo))/2+3}" text-anchor="middle" font-size="9" fill="#5d6a82">N/A</text>`; return; }
    let base=0;
    for(const s of series){ const v=s.vals[i]||0; if(!v) continue; const y0=ys(base), y1=ys(base+v); bars+=`<rect x="${xc(i)-bw/2}" y="${Math.min(y0,y1)}" width="${bw}" height="${Math.max(1,Math.abs(y1-y0))}" rx="2" fill="${s.color}"/>`; base+=v; }
    bars+=`<text x="${xc(i)}" y="${(tot[i]>=0?ys(tot[i])-4:ys(tot[i])+10)}" text-anchor="middle" font-size="9" fill="#c9d3e6">${tfNum(tot[i])}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="tf-svg" role="img" aria-label="กราฟ ${unit}">
    <line x1="${P}" x2="${W-P}" y1="${ys(0)}" y2="${ys(0)}" stroke="#2a3346"/>${bars}
    ${labels.map((l,i)=>`<text x="${xc(i)}" y="${H-6}" text-anchor="middle" font-size="9" fill="#7b879c">${l}</text>`).join("")}</svg>`;
}
function tfTable(head, rows){
  return `<div class="tf-table-wrap"><table class="tf-table"><thead><tr><th></th>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r=>`<tr><th>${r[0]}</th>${r.slice(1).map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function tfSources(facts){
  const m=new Map();
  facts.filter(f=>f&&f.sourceUrl).forEach(f=>{ if(!m.has(f.sourceUrl)) m.set(f.sourceUrl,f); });
  if(!m.size) return "";
  return `<div class="tf-src">แหล่ง: ${[...m.values()].map(f=>`<a href="${escAttr(f.sourceUrl)}" target="_blank" rel="noopener">${esc(f.sourceName)}</a> (งวด ${esc(f.periodEnd)} · อัปเดต ${esc(f.updatedAt)})`).join(" · ")}</div>`;
}
const tfTag = reported => reported===false ? ` <span class="tf-calc">คำนวณ</span>` : "";
const tfNA = reason => `<span class="tf-na"${reason?` title="${escAttr(reason)}"`:""}>N/A</span>`;

function thaiFundSection(sec){
  const head = `<h3>กำไร ปันผล และการใช้ทุน · 5 ปีบัญชี</h3>`;
  if(thaiFundErr) return `<div class="sh-sec">${head}<div class="miss-box">โหลดข้อมูลงบไม่สำเร็จ — ${esc(thaiFundErr)}</div></div>`;
  if(!thaiFund) return `<div class="sh-sec">${head}<div class="loading" style="padding:10px 0">⏳ กำลังโหลดข้อมูลงบ…</div></div>`;
  const stock = thaiFund.stocks[sec.t] || {annual:[], bank:{}};
  const A = TF.analyze(stock);
  const L = A.rows.map(r=>r.labelBE);
  let html = `<div class="sh-sec tf">${head}
    <div class="note" style="margin:0 0 6px">ปีบัญชี ${L[0]}–${L[L.length-1]} (พ.ศ.) · ${esc(tfBasisTh(A.basis))} · ข้อมูลจาก IR / SET ที่ผู้ดูแลกรอก แยกจากราคา Yahoo</div>`;
  if(!A.hasAny){
    return html + `<div class="miss-box">ยังไม่มีข้อมูลงบรายปีที่ตรวจสอบได้ของ ${esc(sec.t)} — รอผู้ดูแลกรอกใน src/data/thai-fundamentals.json พร้อมลิงก์แหล่งอ้างอิง</div></div>` + thaiBankSection(sec, stock);
  }
  // 1) ROE
  html += `<div class="tf-block"><div class="tf-title">ROE 5 ปี <span class="tf-unit">(%)</span></div>
    ${tfLineSvg(L, A.rows.map(r=>r.roe.value), "%", "#4f8cff") || `<div class="miss-box">ยังไม่มี ROE ที่รายงานหรือคำนวณได้</div>`}
    ${tfTable(L, [["ROE (%)", ...A.rows.map(r=>r.roe.value==null?tfNA(r.roe.reason):tfNum(r.roe.value,1)+tfTag(r.roe.reported))]])}
    ${A.rows.some(r=>r.roe.reported===false)?`<div class="note">คำนวณ: ${esc(TF.ROE_FORMULA)}</div>`:""}
    ${A.rows.filter(r=>r.roe.value==null&&r.row).map(r=>`<div class="note">ปี ${r.labelBE}: ${esc(r.roe.reason)}</div>`).join("")}
    ${tfSources(A.rows.map(r=>r.roe.fact))}</div>`;
  // 2) DPS + Payout
  html += `<div class="tf-block"><div class="tf-title">เงินปันผลต่อหุ้น <span class="tf-unit">(บาท)</span> และสัดส่วนจ่ายปันผล <span class="tf-unit">(%)</span></div>
    ${tfBarSvg(L, [{vals:A.rows.map(r=>r.div.regular),color:"#26c281"},{vals:A.rows.map(r=>r.div.special),color:"#f0c040"}], "บาท") || `<div class="miss-box">ยังไม่มี DPS ที่ยืนยันได้</div>`}
    <div class="tf-legend"><span><i style="background:#26c281"></i>ปันผลปกติ</span><span><i style="background:#f0c040"></i>ปันผลพิเศษ</span><span>ผูกกับปีบัญชีของผลประกอบการ ไม่ใช่ปีที่จ่าย</span></div>
    ${tfTable(L, [
      ["DPS ปกติ (บาท)", ...A.rows.map(r=>r.div.regular==null?tfNA(r.div.reason):tfNum(r.div.regular))],
      ["DPS พิเศษ (บาท)", ...A.rows.map(r=>r.div.special!=null?tfNum(r.div.special):(r.div.regular!=null?`<span class="tf-na" title="แหล่งข้อมูลยังไม่ยืนยันว่ามีหรือไม่มี">ไม่ทราบ</span>`:tfNA()))],
      ["Payout (%)", ...A.rows.map(r=>r.div.payout==null?tfNA(r.div.reason):tfNum(r.div.payout,1)+tfTag(r.div.payoutReported)+(r.div.overEarnings?`<div class="tf-over">จ่ายเกินกำไรปีนี้</div>`:""))],
    ])}
    ${A.rows.some(r=>r.div.payoutReported===false)?`<div class="note">คำนวณ: DPS (ปกติ + พิเศษที่ยืนยันได้) ÷ EPS ของปีบัญชีเดียวกัน ฐานจำนวนหุ้นเดียวกัน</div>`:""}
    ${A.rows.filter(r=>r.row&&r.div.payout==null&&r.div.reason).map(r=>`<div class="note">ปี ${r.labelBE}: ${esc(r.div.reason)}</div>`).join("")}
    ${tfSources(A.rows.flatMap(r=>r.row?[r.row.dpsRegular,r.row.dpsSpecial,r.row.payoutRatio]:[]))}</div>`;
  // 3) BVPS vs EPS — ปีบัญชีเดียวกัน แยกสเกล ค่าจริงเป็นบาทต่อหุ้น
  const G=A.growth;
  html += `<div class="tf-block"><div class="tf-title">ทุนต่อหุ้น (BVPS) เทียบกำไรต่อหุ้น (EPS) <span class="tf-unit">(บาท/หุ้น)</span></div>
    <div class="tf-pair">
      <div><div class="tf-sub">BVPS</div>${tfBarSvg(L,[{vals:A.rows.map(r=>r.bvps),color:"#a78bfa"}],"BVPS")||`<div class="miss-box">ไม่มี BVPS</div>`}</div>
      <div><div class="tf-sub">EPS</div>${tfBarSvg(L,[{vals:A.rows.map(r=>r.eps),color:"#2dd4bf"}],"EPS")||`<div class="miss-box">ไม่มี EPS</div>`}</div>
    </div>
    ${tfTable(L, [
      ["BVPS (บาท)", ...A.rows.map(r=>r.bvps==null?tfNA():tfNum(r.bvps))],
      ["EPS (บาท)", ...A.rows.map(r=>r.eps==null?tfNA():tfNum(r.eps)+(r.eps<=0?`<div class="tf-over">ขาดทุน</div>`:""))],
    ])}
    <div class="tf-check"><b>สิ่งที่ควรตรวจต่อ:</b> ${esc(G.headline)}
      ${G.detail?`<div class="note" style="margin-top:3px">${esc(G.detail)}</div>`:""}
      ${G.checks.map(c=>`<div class="note" style="margin-top:3px">${esc(c)}</div>`).join("")}
      ${G.shareBaseNotes.length?`<div class="note" style="margin-top:3px">⚠️ ฐานจำนวนหุ้นเปลี่ยน — ${G.shareBaseNotes.map(esc).join(" · ")}</div>`:""}
      <div class="note" style="margin-top:3px">BVPS/EPS สองค่าสรุปไม่ได้ว่าการลงทุนต่อสร้างมูลค่า — การเพิ่มทุน ซื้อหุ้นคืน หรือกำไรพิเศษมีผลได้</div></div>
    ${tfSources(A.rows.flatMap(r=>r.row?[r.row.bvps,r.row.eps]:[]))}</div></div>`;
  return html + thaiBankSection(sec, stock);
}

/* การ์ดเฉพาะธนาคาร — แสดงตาม sector ของหลักทรัพย์ในแอป (ไม่ hard-code ticker) */
function thaiBankSection(sec, stock){
  if(sec.sector !== "banking") return "";
  const B = TF.bankCard(stock);
  return `<div class="sh-sec tf-bank-sec"><h3>ตัวชี้วัดเฉพาะธนาคาร</h3>
    <div class="tf-bank">${B.rows.map(r=>{
      const f=r.fact;
      return `<div class="met tf-bank-met"><div class="k">${esc(r.label)}</div>
        <div class="v">${r.value==null?`<span class="tf-na">ยังไม่มีข้อมูล</span>`:tfNum(r.value)+"%"}</div>
        <div class="d">${esc(r.descTh)}</div>
        ${f?`<div class="d">${esc(f.periodLabel)}${f.annualized?" · annualized":""}${f.basis?" · "+esc(tfBasisTh(f.basis)):""}${f.reported===false?" · คำนวณ":""}</div>
        <div class="d"><a href="${escAttr(f.sourceUrl)}" target="_blank" rel="noopener">${esc(f.sourceName)}</a></div>`:""}</div>`;}).join("")}</div>
    ${B.notes.map(n=>`<div class="warn-box" style="margin-top:6px">${esc(n)}</div>`).join("")}
    <div class="note">ใช้ตัวเลขตามนิยามที่ธนาคารรายงาน · หุ้นธนาคารไม่ใช้ "หนี้/สินทรัพย์" สรุปความเสี่ยง เพราะเงินฝากคือหนี้ตามธรรมชาติของธุรกิจ</div>
    ${B.hasAny?"":`<div class="miss-box" style="margin-top:6px">ยังไม่มีตัวเลขธนาคารที่ตรวจสอบได้ — รอผู้ดูแลกรอกใน src/data/thai-fundamentals.json</div>`}</div>`;
}

/* ---------- Card pieces ---------- */
function cardHeader(sec, d){
  const st = CFG.STATUS_LABEL[sec.status];
  const th = themeOf(sec.theme);
  const chgClr = d.chgPct==null ? "var(--sub)" : d.chgPct>=0 ? "var(--green)":"var(--red)";
  const arrow  = d.chgPct==null ? "" : d.chgPct>=0 ? "▲":"▼";
  return `<div class="accent" style="background:${st.c}"></div>
    <div class="row1">
      <div>
        <div class="tk">${sec.t}</div>
        <div class="nm">${esc(sec.n)}</div>
        ${th?`<div class="theme-tag">${esc(th.label)}</div>`:""}
      </div>
      <div>
        <div class="price">$${fmt(d.price)}</div>
        <div class="chg" style="color:${chgClr}">${arrow} ${d.chgPct==null?"—":fmt(Math.abs(d.chgPct),2)+"%"}</div>
      </div>
    </div>`;
}
function metricsRow(items){
  return `<div class="metrics">` + items.map(m=>
    `<div class="met"><div class="k">${esc(m.k)}</div>
      <div class="v" style="color:${m.c||"var(--txt)"}">${esc(m.v)}</div>
      ${m.d?`<div class="d">${esc(m.d)}</div>`:""}</div>`).join("") + `</div>`;
}
function statusBadge(d){
  const s = EN.opportunityStatus(d);
  const scoreTxt = (d.mode==="timing" && EN.isNum(d.score)) ? " · " + d.score : "";
  return `<span class="badge" style="color:${s.color};background:${s.color}1f">${esc(s.labelTh)}${scoreTxt}</span>`;
}

/** การ์ดแบบย่อ — เห็นเฉพาะสิ่งที่ต้องตัดสินใจ (progressive disclosure) */
function compactCard(sec, d){
  if(!d || d.error){
    const st = CFG.STATUS_LABEL[sec.status];
    return `<div class="card" data-t="${sec.t}">
      <div class="accent" style="background:${st.c}"></div>
      <div class="row1"><div><div class="tk">${sec.t}</div><div class="nm">${esc(sec.n)}</div></div></div>
      <div class="err" style="margin-top:6px">⚠️ โหลดข้อมูลไม่สำเร็จ — ไม่แสดงค่าเป็น 0</div></div>`;
  }
  const st = CFG.STATUS_LABEL[sec.status];
  const reason = d.mode==="timing" ? EN.candidateReason(sec, d)
    : d.mode==="dca" ? "ไม่ให้คะแนนจังหวะ · " + (d.modeWhy||"ข้อมูลมูลค่าไม่พอ")
    : (sec.thesisTh||"");
  return `<div class="card" data-t="${sec.t}">
    ${cardHeader(sec, d)}
    <div class="pills">
      <span class="pill" style="color:${st.c};border-color:${st.c}55">${st.l}</span>
      ${statusBadge(d)}
    </div>
    <div class="reason">${esc(reason)}</div>
    <div class="datestamp">📅 ${fmtDT(d.marketTime)} · ${esc(d.source||SRC_YAHOO)}</div>
  </div>`;
}

/* ---------- 3. VOO Core card ---------- */

  return `<div class="card core" data-t="VOO">
    ${cardHeader(sec, d)}

      <span class="badge" style="color:${s.color};background:${s.color}1f">${esc(s.labelTh)}</span>
      <span class="pill">อ้างอิง ${CFG.referenceTargetPct("core")}%</span>
    </div>
    ${metricsRow([
      {k:"High 52w", v: EN.isNum(d.hi52) ? "$"+fmt(d.hi52,0) : "—"},
      {k:"ต่ำกว่า High", v: EN.isNum(d.dd) ? "-"+fmt(d.dd,1)+"%" : "—", c:"var(--orange)"},
      {k:"ระดับโอกาส", v: b ? b.level+"/4" : "—", c: b?b.color:"var(--mut)"},
      {k:"RSI(14)", v: d.rsi!=null?fmt(d.rsi,0):"—", c:"var(--sub)", d:"ประกอบ"},

    ${b?`<div class="reason">แนวทางรอบนี้: ${esc(b.actionTh)}</div>`:
        `<div class="miss-box">ข้อมูลไม่พอประเมินระดับโอกาส</div>`}
    <div class="info-box">${esc(CFG.CORE_STATEMENT_TH)}</div>

}

/* ---------- จังหวะใช้เงินสด ---------- */
function cashTimingCard(){
  const voo = window.__cardData.VOO;

/* ---------- TAB 2: Mega Trend ---------- */
function renderMega(){
  const el = document.getElementById("tabMega");
  const scores = {};
  for(const s of CFG.universe()){
    const d = window.__cardData[s.t];
    if(d && !d.error && d.mode==="timing") scores[s.t] = d.score;
  }
  const wi = EN.watchlistIndex(scores);
  const themeBtns = [{key:"all", label:"ทั้งหมด", color:"var(--purple)"}].concat(
    CFG.MEGA_THEMES.map(t=>({key:t.key, label:`${t.short} ${t.pct}%`, color:t.color})));

  const passes = s => EN.matchesStatusFilter(s, window.__cardData[s.t], statusFilter);
  const cardsFor = items => items.map(s=>{
    const d = window.__cardData[s.t];
    return d ? compactCard(s, d) : skeleton(s.t);
  }).join("");

  // Moonshot เป็น "ระดับความเสี่ยง" ไม่ใช่ธีมธุรกิจ — จึงไม่ปนอยู่ในกลุ่มธีม
  // แสดงเป็นกลุ่มแยกท้ายหน้าเมื่อดู "ทั้งหมด" หรือเมื่อเลือกฟิลเตอร์ Moonshot เท่านั้น
  const showMoon = (statusFilter === "moon") || (themeFilter === "all");
  const onlyMoon = statusFilter === "moon";

  let body = "";
  if(!onlyMoon){
    const groups = themeFilter==="all" ? CFG.MEGA_THEMES : CFG.MEGA_THEMES.filter(t=>t.key===themeFilter);
    for(const th of groups){
      const items = CFG.universe().filter(s=>
        s.sleeve==="mega" && !CFG.isMoonshot(s) && s.theme===th.key && passes(s));
      if(!items.length) continue;
      body += `<div class="sec-title"><span style="color:${th.color}">${esc(th.label)}</span>
        <span class="hint">${th.pct}% ของ sleeve · ≈${EN.round(CFG.themePctOfReference(th.key),1)}% ของพอร์ตอ้างอิง</span></div>`;
      body += cardsFor(items);
    }
  }
  if(showMoon){
    const moons = CFG.universe().filter(s=>CFG.isMoonshot(s) && passes(s));
    if(moons.length){
      const L = CFG.RISK_LIMITS;
      body += `<div class="sec-title"><span style="color:var(--red)">Moonshot</span>
        <span class="hint">ความเสี่ยงสูง ไม่ใช่ธีมธุรกิจ · ≤${L.moonshotOfReferenceMaxPct}% ของพอร์ตอ้างอิง</span></div>
        <div class="note" style="margin:-4px 4px 8px">เดิมพันขนาดเล็กที่ใช้เงินจากงบ Mega Trend —
          รายตัวไม่เกิน ${L.moonshotSinglePositionMaxPct}% และไม่ให้คะแนนจังหวะ เพราะราคาที่ร่วงแรงทำให้คะแนนดูสูงหลอก</div>`;
      body += cardsFor(moons);
    }
  }
  if(!body) body = `<div class="miss-box">ไม่มีรายการที่ตรงกับตัวกรองนี้</div>`;

  el.innerHTML = `
    <div class="filters themes" id="themeFilters">${themeBtns.map(b=>
      `<button data-theme="${b.key}" aria-pressed="${themeFilter===b.key}"
        style="${themeFilter===b.key?`border-color:${b.color};color:#fff`:""}">${esc(b.label)}</button>`).join("")}</div>
    <div class="filters" id="statusFilters">${CFG.MEGA_STATUS_FILTERS.map(f=>
      `<button data-status="${f.key}" aria-pressed="${statusFilter===f.key}">${esc(f.labelTh)}</button>`).join("")}</div>
    <div class="panel">
      <h2>⚖️ ${esc(CFG.WATCHLIST_INDEX.label)}</h2>
      <div class="gauge" style="margin-top:8px">
        <div class="val" style="color:${wi.value==null?"var(--mut)":"var(--txt)"}">${wi.value==null?"–":wi.value}</div>
        <div class="bar"><div class="pin" style="left:${wi.value==null?50:wi.value}%"></div></div>
      </div>
      <div class="note">${esc(CFG.WATCHLIST_INDEX.noteTh)}${wi.n?` · จาก ${wi.n} ตัวที่ประเมินได้`:""}</div>
    </div>
    ${body}`;

  el.querySelectorAll("#themeFilters button").forEach(b=>{
    b.onclick = ()=>{ themeFilter = b.dataset.theme; renderMega(); };
  });
  el.querySelectorAll("#statusFilters button").forEach(b=>{
    b.onclick = ()=>{ statusFilter = b.dataset.status; renderMega(); };
  });
}

function bindQuickCheck(){
  const ids = ["qc-total","qc-pos","qc-buy","qc-mega"];
  const remember = document.getElementById("qc-remember");
  // เติมค่าที่เคยยินยอมให้จำไว้เท่านั้น
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem(CFG.STORAGE.quickCheckKey)||"null"); }catch(_){}
  if(saved && saved.remember){
    remember.checked = true;
    document.getElementById("qc-total").value = saved.totalListed ?? "";
    document.getElementById("qc-mega").value  = saved.megaValue ?? "";
  }
  const run = ()=>{
    const input = {
      totalListed: document.getElementById("qc-total").value,
      positionValue: document.getElementById("qc-pos").value,
      buyAmount: document.getElementById("qc-buy").value,
      megaValue: document.getElementById("qc-mega").value,
    };
    const r = EN.quickDimeCheck(input, shTicker);
    const out = document.getElementById("qcOut");
    if(!r.ok){
      out.innerHTML = `<div class="miss-box">${esc(r.messageTh)}${
        r.missing.length?`<br>ยังขาด: ${r.missing.map(esc).join(" · ")}`:""}</div>`;
    }else{
      out.innerHTML =
        `<div class="qc-row"><span>น้ำหนักก่อนซื้อ</span><b>${pctTxt(r.weightBeforePct)}</b></div>
         <div class="qc-row"><span>น้ำหนักหลังซื้อ</span><b>${pctTxt(r.weightAfterPct)}</b></div>` +
        (r.megaWeightAfterPct!=null
          ? `<div class="qc-row"><span>Mega Trend หลังซื้อ</span><b>${pctTxt(r.megaWeightAfterPct)}</b></div>`
          : `<div class="qc-row"><span>Mega Trend หลังซื้อ</span><b style="color:var(--mut)">— (ไม่ได้กรอก)</b></div>`) +
        r.warnings.map(w=>`<div class="${w.level==="hard"?"risk-box":"warn-box"}">${esc(w.th)}</div>`).join("") +
        `<div class="note">${esc(r.noteTh)}</div>`;
    }
    // บันทึกเฉพาะเมื่อผู้ใช้ติ๊กเอง และเก็บเฉพาะค่ารวมของพอร์ต ไม่เก็บจำนวนที่จะซื้อ
    try{
      if(remember.checked){
        localStorage.setItem(CFG.STORAGE.quickCheckKey, JSON.stringify({
          remember:true, totalListed: input.totalListed || null, megaValue: input.megaValue || null,
        }));
      }else{
        localStorage.removeItem(CFG.STORAGE.quickCheckKey);
      }
    }catch(_){}
  };
  ids.forEach(id=>document.getElementById(id).addEventListener("input", run));
  remember.addEventListener("change", run);
  run();
}

function renderCmRanges(){
  const bar = cmEl("ranges");
  if(!bar) return;
  bar.innerHTML = CM_RANGES.map((x,i)=>`<button class="${i===cmIdx?'on':''}" data-i="${i}">${x.l}</button>`).join("");
  bar.querySelectorAll("button").forEach(b=>{
    b.onclick = ()=>{ cmIdx = parseInt(b.dataset.i,10); renderCmRanges(); loadChart(); };
  });
}
async function loadChart(){
  const box = cmEl("chart");
  if(!box || !cmCtx) return;
  const sym = cmCtx.sym, seq = ++cmSeq;
  const {r,i} = CM_RANGES[cmIdx];
  const key = sym+":"+r;
  let hit = cmCache[key];
  if(!hit || Date.now()-hit.ts > 60000)
    box.innerHTML = '<div class="loading" style="padding:30px 0;text-align:center">⏳ กำลังโหลดกราฟ…</div>';
  try{
    if(!hit || Date.now()-hit.ts > 60000){ hit = {ts:Date.now(), res: await fetchYahoo(sym, r, i)}; cmCache[key] = hit; }
    if(seq !== cmSeq || !cmCtx || cmCtx.sym !== sym) return;   // ผู้ใช้เปลี่ยนช่วง/ปิด drawer ระหว่างรอ
    const res = hit.res;
    const ts = res.timestamp||[], cl = (res.indicators&&res.indicators.quote&&res.indicators.quote[0].close)||[];
    const pts = [];
    for(let k=0;k<ts.length;k++) if(cl[k]!=null) pts.push({t:ts[k], c:cl[k]});
    if(pts.length<2) throw new Error("no points");
    const closes = pts.map(p=>p.c);
    const hi = Math.max(...closes), lo = Math.min(...closes);
    const up = closes[closes.length-1] >= closes[0];
    cmEl("d1").textContent = fmtD(pts[0].t);
    cmEl("d2").textContent = fmtD(pts[pts.length-1].t);
    box.innerHTML = chartSVG(pts, up, hi, lo);
  }catch(e){
    if(seq !== cmSeq) return;
    box.innerHTML = '<div class="err" style="padding:30px 0;text-align:center">⚠️ โหลดกราฟไม่สำเร็จ</div>';
  }
}
function chartSVG(pts, up, hi, lo){
  const W=560, H=190, P=8;
  const span=(hi-lo)||1;
  const X=k=>P+(W-2*P)*k/(pts.length-1);
  const Y=c=>P+(H-2*P)*(1-(c-lo)/span);
  let d="M"+X(0).toFixed(1)+" "+Y(pts[0].c).toFixed(1);
  for(let k=1;k<pts.length;k++) d+="L"+X(k).toFixed(1)+" "+Y(pts[k].c).toFixed(1);
  const area=d+`L${X(pts.length-1).toFixed(1)} ${H} L${X(0).toFixed(1)} ${H} Z`;
  const col=up?"#26c281":"#ef5365", gid="cmGrad"+(cmCtx?cmCtx.bodyId:"");
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="กราฟราคา">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${col}" stop-opacity="0.30"/><stop offset="1" stop-color="${col}" stop-opacity="0"/>
    </linearGradient></defs>
    <text x="${P}" y="${P+10}" font-size="10" fill="#5d6a82">${fmt(hi)}</text>
    <text x="${P}" y="${H-P-4}" font-size="10" fill="#5d6a82">${fmt(lo)}</text>
    <path d="${area}" fill="url(#${gid})"/>
    <path d="${d}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(pts.length-1).toFixed(1)}" cy="${Y(pts[pts.length-1].c).toFixed(1)}" r="4" fill="${col}"/>
  </svg>`;
}

function buildSnapshot(){
  const holdings = [];
  CFG.universe().forEach(sec=>{
    const d = window.__cardData[sec.t];
    if(!d || d.error) return;
    const h = {t:sec.t, sleeve:sec.sleeve, theme:sec.theme||null, price:+fmt(d.price)};
    if(CFG.isMoonshot(sec)) h.moon = 1;
    if(d.mode==="timing"){ h.score = d.score; h.status = EN.opportunityStatus(d).labelTh;
      if(EN.okVal(d.val)){ h.pe = +fmt(d.val.curPE,0); h.medPE = +fmt(d.val.medPE,0); } }
    if(d.mode==="dca") h.noScore = d.modeWhy || "ข้อมูลมูลค่าไม่พอ";
    if(EN.isNum(d.dd)) h.disc = +fmt(d.dd,1);
    if(d.mode==="core_market" && d.core) h.coreBand = d.core.labelTh;
    if(d.mode==="dividend_growth"){
      if(EN.isNum(d.curYield)) h.yield = +fmt(d.curYield,2);
      if(d.stats && EN.isNum(d.stats.medYieldPct)) h.medYield = +fmt(d.stats.medYieldPct,2);
      if(d.stats && EN.isNum(d.stats.growthCagrPct)) h.divGrowth = +fmt(d.stats.growthCagrPct,1);
      if(EN.isNum(d.totalReturn)) h.totalReturn = +fmt(d.totalReturn,0);
    }
    if(d.mode==="current_income_option"){
      if(EN.isNum(d.curYield)) h.yield = +fmt(d.curYield,2);
      if(EN.isNum(d.totalReturn)) h.totalReturn = +fmt(d.totalReturn,0);
      if(d.driver) h.yieldDriver = d.driver.driver;
      if(d.income) h.incomeLevel = d.income.labelTh;
    }
    holdings.push(h);
  });
  const scores = {};
  for(const s of CFG.universe()){
    const d = window.__cardData[s.t];
    if(d && !d.error && d.mode==="timing") scores[s.t] = d.score;
  }
  const wi = EN.watchlistIndex(scores);
  const voo = window.__cardData.VOO;
  const ct = voo && !voo.error ? EN.cashTiming(voo.dd) : null;
  return {
    time: new Date().toLocaleString("th-TH"),
    ipsVersion: CFG.IPS_VERSION,
    ledger: CFG.APP.ledgerName,
    gauge: wi.value, gaugeN: wi.n,
    reference: Object.fromEntries(CFG.REFERENCE_ALLOCATION.map(r=>[r.key, r.pct])),
    themes: Object.fromEntries(CFG.MEGA_THEMES.map(t=>[t.key, t.pct])),
    cashTiming: ct ? ct.labelTh : null,
    top: EN.rankOpportunities(window.__cardData).map(r=>({t:r.ticker, theme:r.themeKey, score:r.score, limited:r.limitedData})),
    holdings,
  };
}

const KIRIN_DAILY_LIMIT = 3;
function kirinQuota(){
  const day = new Date().toISOString().slice(0,10);
  const KEY = "kirinCalls:"+day;
  let used = 0; try{ used = parseInt(localStorage.getItem(KEY)||"0",10)||0; }catch(_){}
  used = Math.min(used, KIRIN_DAILY_LIMIT);
  return {day, KEY, used, limit:KIRIN_DAILY_LIMIT, remaining:Math.max(0, KIRIN_DAILY_LIMIT-used)};
}
function renderKirinQuota(){
  const q = kirinQuota();
  let dots = ""; for(let i=0;i<q.limit;i++) dots += `<span class="d${i<q.used?" used":""}"></span>`;
  const el = document.getElementById("kirinQuota");
  if(el) el.innerHTML = `<span>โควตา AI</span><span class="meter">${dots}</span>` +
    (q.remaining>0 ? `<span class="rem">เหลือ ${q.remaining}/${q.limit}</span> ครั้งวันนี้`
                   : `<span class="rem empty">ครบโควตาวันนี้</span> · รีเซ็ตพรุ่งนี้`);
  const btn = document.getElementById("kirinBtn");
  if(btn && !kirinBusy){
    btn.disabled = q.remaining<=0;
    btn.textContent = q.remaining>0 ? "🔮 วิเคราะห์" : "ครบโควตาแล้ว";
  }
}
function showCachedKirinOnce(){
  const today = new Date().toISOString().slice(0,10);
  try{
    const c = JSON.parse(localStorage.getItem("kirin:"+today)||"null");
    if(c && c.analysis) renderKirin(c.analysis, c.ts, true, c.guardrail);
  }catch(_){}
}
let kirinBusy = false;
async function runKirin(){
  const box = document.getElementById("kirinBody"), btn = document.getElementById("kirinBtn");
  if(kirinBusy) return;
  const q = kirinQuota();
  if(q.remaining<=0){
    box.innerHTML = '<div class="err" style="margin-top:10px">ใช้ครบ '+q.limit+' ครั้งแล้ววันนี้ 🌙 รีเซ็ตพรุ่งนี้</div>';
    renderKirinQuota(); return;
  }
  const snap = buildSnapshot();
  if(!snap.holdings.length){ box.innerHTML = '<div class="loading" style="margin-top:10px">รอข้อมูลราคาโหลดก่อน แล้วลองใหม่</div>'; return; }
  kirinBusy = true; btn.disabled = true;
  box.innerHTML = '<div class="loading dots" style="margin-top:10px">🐉 Kirin กำลังอ่านนโยบายและสภาพตลาด</div>';
  const ctrl = new AbortController(); const to = setTimeout(()=>ctrl.abort(),30000);
  try{
    const res = await fetch("./api/kirin",{method:"POST",
      headers:{"content-type":"application/json","x-kirin-client":"1"}, body:JSON.stringify(snap), signal:ctrl.signal});
    const j = await res.json().catch(()=>null);
    if(j && j.analysis){
      const ts = Date.now();
      try{ localStorage.setItem("kirin:"+new Date().toISOString().slice(0,10), JSON.stringify({ts, analysis:j.analysis, guardrail:j.guardrail})); }catch(_){}
      try{ localStorage.setItem(q.KEY, String(q.used+1)); }catch(_){}
      renderKirin(j.analysis, ts, false, j.guardrail);
    }else if(res.status===429){
      box.innerHTML = '<div class="err" style="margin-top:10px">เรียกถี่เกินไป — รอสักครู่ (ไม่นับโควตา)</div>';
    }else{
      box.innerHTML = '<div class="err" style="margin-top:10px">วิเคราะห์ไม่สำเร็จ'+(j&&j.error?" ("+esc(j.error)+")":"")+' (ไม่นับโควตา)</div>';
    }
  }catch(e){
    box.innerHTML = '<div class="err" style="margin-top:10px">เชื่อมต่อไม่ได้ — ลองใหม่ (ไม่นับโควตา)</div>';
  }finally{ clearTimeout(to); kirinBusy = false; renderKirinQuota(); }
}

/* ---------- Snapshot (offline) ---------- */
const SNAP_KEY = "snap3";
function saveSnapshot(cards, marketTime){
  try{ localStorage.setItem(SNAP_KEY, JSON.stringify({savedAt:Date.now(), marketTime, cards})); }catch(_){}
}
function loadSnapshot(){
  try{
    // snap3 = โครงปัจจุบัน; ถ้ายังไม่มี ลองอ่านของเวอร์ชันก่อน (ข้อมูลราคายังใช้ได้)
    const raw = localStorage.getItem(SNAP_KEY) || localStorage.getItem("snap2") || localStorage.getItem("snap1");
    return raw ? JSON.parse(raw) : null;
  }catch(_){ return null; }
}

let busy = false;
async function loadAll(){
  if(busy) return; busy = true;
  window.__fromCache = false;
  document.getElementById("refIcon").classList.add("spin");
  renderStatusBar({loading:true, marketTime:window.__marketTime});

  const flat = CFG.universe();
  const results = await Promise.all(flat.map(loadOne));
  const cards = {};
  let errors = 0;
  flat.forEach((sec,i)=>{
    if(results[i].error){ errors++; window.__cardData[sec.t] = results[i]; }
    else { window.__cardData[sec.t] = results[i]; cards[sec.t] = results[i]; }
  });

  const oks = results.filter(r=>!r.error && r.marketTime);
  const marketTime = oks.length ? Math.max(...oks.map(r=>r.marketTime)) : null;
  window.__marketTime = marketTime;
  if(oks.length && !window.__fromCache) saveSnapshot(cards, marketTime);

  if(UI.market !== "thai"){
    renderStatusBar({marketTime, errors: errors||null, savedAt: window.__fromCache?Date.now():null});
    showTab();
  }
  document.getElementById("refIcon").classList.remove("spin");
  busy = false;
}

/* ---------- Events ---------- */
document.body.addEventListener("click", e=>{
  const thaiBtn = e.target.closest("[data-thai-detail]");
  if(thaiBtn){ openThaiSheet(thaiBtn.dataset.thaiDetail); return; }
  const btn = e.target.closest("[data-detail]");
  if(btn){ openSheet(btn.dataset.detail); return; }
  const card = e.target.closest(".card[data-t]");
  if(card && !e.target.closest("input,label,a,button")) openSheet(card.dataset.t);
});
document.getElementById("sheet").addEventListener("click", e=>{ if(e.target.id==="sheet") closeSheet(); });
document.getElementById("thaiSheet").addEventListener("click", e=>{ if(e.target.id==="thaiSheet") closeThaiSheet(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && shTicker) closeSheet(); if(e.key==="Escape" && thaiTicker) closeThaiSheet(); });
window.addEventListener("online", ()=>{ window.__fromCache = false; renderStatusBar({marketTime:window.__marketTime}); });
window.addEventListener("offline", ()=>renderStatusBar({marketTime:window.__marketTime}));

/* ---------- Service Worker (offline mode) ---------- */
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}

/* ---------- Boot ---------- */
(function boot(){
  document.getElementById("ipsVer").textContent = CFG.IPS_VERSION_LABEL;
  try{ UI = EN.runMigration(window.localStorage).ui; }catch(_){ UI = EN.defaultUiState(); }

  renderMarketSwitch();
  renderTabs();
  const snap = loadSnapshot();
  if(snap && snap.cards){
    window.__cardData = snap.cards;
    window.__marketTime = snap.marketTime || null;
    renderStatusBar({marketTime: snap.marketTime, savedAt: snap.savedAt,
                     stale: Date.now()-snap.savedAt > EN.STALE_AFTER_MS});
  }
  showActiveMarket();
  if(UI.market !== "thai" && (isMarketOpen() || !snap)) loadAll();   // ยิงสดเฉพาะตอนตลาดเปิด หรือยังไม่เคยมีข้อมูล
})();
</script>
